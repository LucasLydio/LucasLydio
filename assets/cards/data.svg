<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Data layer card</title>
<desc id="desc">PostgreSQL, Prisma and Redis represented with animated database and cache flows.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#08111d"/><stop offset="1" stop-color="#101827"/></linearGradient>
</defs>
<rect width="1200" height="330" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="328" rx="25" fill="none" stroke="#263754"/>

<text x="54" y="58" fill="#788ca8" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3">STACK / 04</text>
<text x="54" y="110" fill="#f7fbff" font-family="Arial, sans-serif" font-weight="700" font-size="42">Data &amp; caching</text>
<text x="54" y="148" fill="#a8b7ca" font-family="Arial, sans-serif" font-size="18">Persistence, transactions, migrations and fast access paths.</text>

<g font-family="ui-monospace, monospace" font-size="15">
  <text x="54" y="205" fill="#70b8ff">PostgreSQL</text>
  <text x="151" y="205" fill="#a8b7ca">Prisma</text>
  <text x="219" y="205" fill="#a8b7ca">Redis</text>
  <text x="54" y="238" fill="#a8b7ca">Relational modeling</text>
  <text x="204" y="238" fill="#a8b7ca">Transactions</text>
  <text x="54" y="271" fill="#a8b7ca">Migrations</text>
  <text x="143" y="271" fill="#a8b7ca">Caching</text>
  <text x="214" y="271" fill="#a8b7ca">Consistency</text>
</g>

<!-- data scene -->
<g transform="translate(720 48)">
  <g fill="#0d1d2f" stroke="#3f79ad" stroke-width="2">
    <ellipse cx="115" cy="42" rx="86" ry="30"/>
    <path d="M29 42V156C29 173 67 186 115 186S201 173 201 156V42"/>
    <ellipse cx="115" cy="156" rx="86" ry="30"/>
  </g>
  <ellipse cx="115" cy="42" rx="86" ry="30" fill="#173559" opacity=".7"/>
  <text x="115" y="48" fill="#9ed1ff" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">POSTGRES</text>

  <g transform="translate(280 50)">
    <rect width="116" height="116" rx="22" fill="#281215" stroke="#a4474f"/>
    <text x="58" y="51" fill="#ff9da4" font-family="ui-monospace, monospace" font-size="16" text-anchor="middle">REDIS</text>
    <text x="58" y="74" fill="#b96c73" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">CACHE</text>
  </g>

  <path id="flow" d="M202 100 C235 70 255 70 280 100" fill="none" stroke="#65d6ff" stroke-width="3" stroke-dasharray="6 8"/>
  <circle r="6" fill="#65d6ff">
    <animateMotion dur="2.8s" repeatCount="indefinite">
      <mpath href="#flow"/>
    </animateMotion>
  </circle>

  <g fill="#70e1a1">
    <circle cx="70" cy="90" r="5"><animate attributeName="cy" values="90;130;90" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="115" cy="105" r="5"><animate attributeName="cy" values="105;145;105" dur="5s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="92" r="5"><animate attributeName="cy" values="92;132;92" dur="5s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>
</g>
</svg>
