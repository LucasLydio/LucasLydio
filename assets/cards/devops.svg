<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">DevOps cloud and observability card</title>
<desc id="desc">Cloud delivery, containers and observability represented by an animated deployment topology.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#09111c"/><stop offset="1" stop-color="#111627"/></linearGradient>
  <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#65d6ff"/><stop offset=".5" stop-color="#8b7cff"/><stop offset="1" stop-color="#70e1a1"/></linearGradient>
</defs>
<rect width="1200" height="330" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="328" rx="25" fill="none" stroke="#2a3958"/>

<text x="54" y="58" fill="#7a8dab" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3">STACK / 06</text>
<text x="54" y="110" fill="#f7faff" font-family="Arial, sans-serif" font-weight="700" font-size="42">Delivery &amp; observability</text>
<text x="54" y="148" fill="#a9b6ca" font-family="Arial, sans-serif" font-size="18">Reproducible environments, automated delivery and visible production health.</text>

<g font-family="ui-monospace, monospace" font-size="15">
  <text x="54" y="205" fill="#70d8ff">Docker</text>
  <text x="118" y="205" fill="#a9b6ca">GitHub Actions</text>
  <text x="244" y="205" fill="#a9b6ca">Nginx</text>
  <text x="54" y="238" fill="#a9b6ca">Terraform</text>
  <text x="136" y="238" fill="#a9b6ca">AWS</text>
  <text x="177" y="238" fill="#a9b6ca">Netlify</text>
  <text x="241" y="238" fill="#a9b6ca">Vercel</text>
  <text x="54" y="271" fill="#a9b6ca">Grafana</text>
  <text x="121" y="271" fill="#a9b6ca">Prometheus</text>
  <text x="219" y="271" fill="#a9b6ca">Health checks</text>
</g>

<!-- topology -->
<g transform="translate(650 54)" font-family="ui-monospace, monospace" text-anchor="middle">
  <path id="deploy" d="M55 105H165H270H380H475" fill="none" stroke="url(#flow)" stroke-width="3" stroke-dasharray="7 9">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <g>
    <rect x="10" y="70" width="90" height="70" rx="16" fill="#0f1d31" stroke="#3e6f9d"/>
    <text x="55" y="101" fill="#99dfff" font-size="12">SOURCE</text>
    <text x="55" y="121" fill="#7188a5" font-size="10">git</text>
  </g>
  <g>
    <rect x="120" y="70" width="90" height="70" rx="16" fill="#151c35" stroke="#5b5aa0"/>
    <text x="165" y="101" fill="#bbb1ff" font-size="12">CI</text>
    <text x="165" y="121" fill="#7f7ca6" font-size="10">actions</text>
  </g>
  <g>
    <rect x="225" y="70" width="90" height="70" rx="16" fill="#102235" stroke="#397db0"/>
    <text x="270" y="101" fill="#9cddff" font-size="12">IMAGE</text>
    <text x="270" y="121" fill="#718da5" font-size="10">docker</text>
  </g>
  <g>
    <rect x="335" y="70" width="90" height="70" rx="16" fill="#18223a" stroke="#6a62a8"/>
    <text x="380" y="101" fill="#c4bbff" font-size="12">CLOUD</text>
    <text x="380" y="121" fill="#8883aa" font-size="10">deploy</text>
  </g>
  <g>
    <rect x="430" y="70" width="90" height="70" rx="16" fill="#11291f" stroke="#3f7d5c"/>
    <text x="475" y="101" fill="#a8efc4" font-size="12">OBSERVE</text>
    <text x="475" y="121" fill="#789685" font-size="10">metrics</text>
  </g>

  <circle r="6" fill="#ffffff">
    <animateMotion dur="6s" repeatCount="indefinite">
      <mpath href="#deploy"/>
    </animateMotion>
  </circle>

  <!-- waveform -->
  <path d="M35 202 L76 202 L91 176 L108 226 L128 190 L145 202 L498 202" fill="none" stroke="#70e1a1" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="498" cy="202" r="5" fill="#70e1a1">
    <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
