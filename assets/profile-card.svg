<svg fill="none" width="400px" height="auto" viewBox="0 0 550 380" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          background: #0d1117;
          border: 2px solid #00f0ff;
          border-radius: 12px;
          padding: 20px;
          display: flex;
          align-items: center;
          gap: 20px;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
          animation: glow 3s infinite alternate;
        }
        @keyframes glow {
          0% { box-shadow: 0 0 8px rgba(0, 240, 255, 0.3); border-color: #00f0ff; }
          100% { box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); border-color: #ff0055; }
        }
        .avatar {
          width: 95px;
          height: 95px;
          border-radius: 50%;
          border: 3px solid #ff0055;
          object-fit: cover;
          flex-shrink: 0;
        }
        .info {
          color: #ffffff;
        }
        .name {
          color: #00f0ff;
          font-size: 1.5rem;
          font-weight: 700;
          margin: 0 0 2px 0;
          letter-spacing: 1px;
        }
        .role {
          color: #ff0055;
          font-size: 1.4rem;
          font-weight: 600;
          margin: 0 0 10px 0;
          text-transform: uppercase;
        }
        .tags {
          margin-bottom: 8px;
        }
        .tag {
          display: inline-block;
          background: rgba(0, 240, 255, 0.1);
          color: #00f0ff;
          border: 1px solid #00f0ff;
          border-radius: 4px;
          padding: 2px 8px;
          font-size: 1.2rem;
          margin-right: 4px;
        }
        .bio {
          font-size: 1.2rem;
          color: #8b949e;
          line-height: 1.4;
        }
      </style>

      <div class="container">
        <img class="avatar" src="./profile/profilegit.webp" alt="Profile Photo" />
        <div class="info">
          <div class="name">Lucas Lydio</div>
          <div class="role">PLAYER 1 • FULL-STACK DEVELOPER</div>
          <div class="tags">
            <span class="tag">Backend</span>
            <span class="tag">Frontend</span>
            <span class="tag">CI/CD</span>
            <span class="tag">AI</span>
          </div>
          <div class="bio">
            🎮 Building web apps &amp; breaking code<br/>
            📍 Location: Online
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
